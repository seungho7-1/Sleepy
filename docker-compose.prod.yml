version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sleepy-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sleepy
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.2-alpine
    container_name: sleepy-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: sleepy-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://db:3306/sleepy?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_FRONTEND_URL=https://sleepyslime.p-e.kr

volumes:
  db_data:
  redis_data:
